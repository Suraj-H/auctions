services:
  db:
    image: postgres:16-alpine
    container_name: auctions-db
    environment:
      POSTGRES_USER: auctions
      POSTGRES_PASSWORD: auctions
      POSTGRES_DB: auctions
    ports:
      - "55432:5432"
    # The bid path is one statement per request and the harness opens
    # hundreds of real connections, so the default 100 is not enough.
    command: postgres -c max_connections=600
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctions -d auctions"]
      interval: 1s
      timeout: 3s
      retries: 30
